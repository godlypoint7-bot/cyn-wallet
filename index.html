<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyn Wallet</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#182238;font:15px Arial}
header{background:#102b52;color:white;padding:22px;font-size:22px;font-weight:bold}
.sub{font-size:13px;font-weight:normal;margin-top:6px;color:#c8d8ef}
main{max-width:760px;margin:24px auto;padding:0 14px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #172b4910}
.balance{background:linear-gradient(135deg,#10396d,#1767b5);color:white}
.small{font-size:13px;color:#738198}
.balance .small{color:#d6e6ff}
.amount{font-size:32px;font-weight:bold;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f5}
.row:last-child{border:0}
nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:13px;background:#1458a6;color:white;font-weight:bold;flex:1}
button.secondary{background:#eaf1fb;color:#174c8c}
.hidden{display:none}
.status{color:#16834a}
#error{color:#c22}
</style>
</head>

<body>

<header>
Cyn Wallet
<div class="sub">Personal wallet</div>
</header>

<main>

<div id="error" class="card hidden"></div>

<nav>
<button onclick="page('overview')">Overview</button>
<button class="secondary" onclick="page('history')">History</button>
<button class="secondary" onclick="refreshWallet()">Refresh</button>
</nav>

<div id="overview" class="page">

<div class="card balance">
<div class="small">Available balance</div>
<div class="amount" id="balance">Loading...</div>
<div class="small" id="currency">CNY</div>
</div>

<div class="card">
<h3>Account overview</h3>
<div class="row"><span>Account name</span><strong id="accountName">—</strong></div>
<div class="row"><span>Account number</span><strong id="accountNumber">—</strong></div>
<div class="row"><span>Username</span><strong id="username">—</strong></div>
<div class="row"><span>Account status</span><strong class="status" id="status">—</strong></div>
</div>

<div class="card">
<h3>Recent activity</h3>
<div id="recent">Loading...</div>
</div>

</div>

<div id="history" class="page hidden">
<div class="card">
<h3>Transaction history</h3>
<div id="transactions">Loading...</div>
</div>
</div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,doc,getDoc,collection,getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCM47pBWKGK8pgsK_u47GPUnNBA78vLRug",
authDomain:"cyn-wallet.firebaseapp.com",
projectId:"cyn-wallet",
storageBucket:"cyn-wallet.firebasestorage.app",
messagingSenderId:"921923481845",
appId:"1:921923481845:web:700498e8fc8f65024195bc",
measurementId:"G-STJWJB39MF"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const UID="Xn01IOvMgvfbAnkj09evtYK1Tco1";

const $=id=>document.getElementById(id);

function money(value,currency){
return (currency||"CNY")+" "+
Number(value||0).toLocaleString("en-US",{
minimumFractionDigits:0,
maximumFractionDigits:2
});
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

window.page=function(name){
document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
$(name).classList.remove("hidden");
};

window.refreshWallet=async function(){
$("error").classList.add("hidden");

try{

// Load your existing Firestore user document.
const userRef=doc(db,"users",UID);
const userSnap=await getDoc(userRef);

if(!userSnap.exists()){
throw Error("Firestore user document not found.");
}

const data=userSnap.data();

// Display the saved account fields.
$("accountName").textContent=data.accountName||"—";
$("accountNumber").textContent=data.accountNumber||"—";
$("username").textContent=data.username||"—";
$("status").textContent=data.status||"—";

$("balance").textContent=money(data.balance,data.currency);
$("currency").textContent=data.currency||"CNY";

// Read the transactions subcollection.
const txSnap=await getDocs(collection(userRef,"transactions"));

const rows=txSnap.docs.map(d=>d.data());

rows.sort((a,b)=>{
const timeA=a.createdAt?.seconds||0;
const timeB=b.createdAt?.seconds||0;
return timeB-timeA;
});

function transactionHTML(t){
return `<div class="row">
<span>${escapeHTML(t.description||t.type||"Transaction")}
<br><span class="small">${escapeHTML(t.status||"")}</span>
</span>
<strong>${escapeHTML(t.amount??"")}</strong>
</div>`;
}

$("transactions").innerHTML=rows.length
?rows.map(transactionHTML).join("")
:"<p>No transactions available.</p>";

$("recent").innerHTML=rows.length
?rows.slice(0,3).map(transactionHTML).join("")
:"<p>No recent activity.</p>";

}catch(e){
$("error").textContent=e.message;
$("error").classList.remove("hidden");
}
};

refreshWallet();

</script>
</body>
</html>
