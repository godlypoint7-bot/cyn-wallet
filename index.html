<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYN Wallet</title>
<style>
:root{--navy:#10233f;--blue:#1769aa;--bg:#f3f6fb;--ink:#17253b;--muted:#6b7890;--line:#e5eaf2;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Arial,sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;padding:22px 20px 25px}
.brand{font-size:20px;font-weight:700;letter-spacing:.4px}.sub{opacity:.75;font-size:12px;margin-top:4px}
main{max-width:620px;margin:0 auto;padding:18px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 5px 20px #10233f08}
h2{font-size:18px;margin:0 0 16px}label{display:block;font-weight:600;font-size:13px;margin:13px 0 6px}
input{width:100%;padding:14px;border:1px solid #d8dfeb;border-radius:10px;font-size:16px;background:#fff}
button{border:0;border-radius:10px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:#fff;width:100%;margin-top:18px}
.secondary{background:#edf3fa;color:var(--blue)}
.error{color:#b42318;font-size:13px;margin-top:10px}
.hidden{display:none!important}
.balance-label{color:#d5e4f8;font-size:13px}.balance{font-size:32px;font-weight:700;color:white;margin:7px 0 0}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-label{font-size:12px;color:var(--muted)}.detail-value{font-weight:600;word-break:break-word;margin-top:4px}
nav{display:flex;gap:8px;margin:0 0 15px}nav button{flex:1;padding:11px 5px;font-size:13px}
nav button.active{background:var(--navy);color:#fff}
.tx{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.tx:last-child{border:0}.tx-title{font-weight:600}.tx-meta{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:700;white-space:nowrap}.empty{color:var(--muted);text-align:center;padding:22px 0}
.notice{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<header><div class="brand">CYN WALLET</div><div class="sub">Personal wallet</div></header>
<main>
<section id="login" class="card">
<h2>Sign in</h2>
<form id="loginForm">
<label for="username">Username</label><input id="username" autocomplete="username" value="程的 Cheng Er34" required>
<label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required>
<button class="primary" type="submit">Sign in</button>
<div id="loginError" class="error"></div>
</form>
<p class="notice">Authentication is handled by the secure server function.</p>
</section>
<section id="app" class="hidden">
<div class="card" style="background:var(--navy);border:0">
<div class="balance-label">Available balance</div><div id="balance" class="balance">¥—</div>
</div>
<nav><button class="active" data-tab="overview">Overview</button><button data-tab="history">History</button><button data-tab="account">Account</button></nav>
<section id="overview" class="card"><h2>Account overview</h2><div class="details">
<div><div class="detail-label">Account name</div><div id="accountName" class="detail-value">—</div></div>
<div><div class="detail-label">Currency</div><div class="detail-value">CNY (¥)</div></div>
<div><div class="detail-label">Account number</div><div id="accountNumber" class="detail-value">—</div></div>
<div><div class="detail-label">Status</div><div id="status" class="detail-value">—</div></div>
</div></section>
<section id="history" class="card hidden"><h2>Transaction history</h2><div id="transactions" class="empty">Loading transactions…</div></section>
<section id="account" class="card hidden"><h2>Account</h2><div class="details">
<div><div class="detail-label">Username</div><div id="shownUsername" class="detail-value">—</div></div>
<div><div class="detail-label">Currency</div><div class="detail-value">CNY (¥)</div></div></div>
<button id="logout" class="secondary" style="width:100%;margin-top:18px">Sign out</button></section>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

/* Replace these values with your Firebase project's Web app configuration. */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const appFirebase = initializeApp(firebaseConfig);
const db = getFirestore(appFirebase);
const functions = getFunctions(appFirebase);
const loginWithPin = httpsCallable(functions, "loginWithPin");

const $ = id => document.getElementById(id);
let currentUserId = null;
const money = value => "¥" + Number(value || 0).toLocaleString("en-US",{maximumFractionDigits:2});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("loginError").textContent = "";
  const username = $("username").value.trim();
  const pin = $("pin").value;
  const button = e.submitter; button.disabled = true; button.textContent = "Signing in…";
  try {
    // The callable function verifies the username/PIN on the server and returns the user document ID.
    const result = await loginWithPin({username,pin});
    currentUserId = result.data.userId;
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    $("shownUsername").textContent = username;
    const data = result.data.account || {};
    $("balance").textContent = money(data.balance);
    $("accountName").textContent = data.accountName || data.username || username;
    $("accountNumber").textContent = data.accountNumber || "—";
    $("status").textContent = data.status || "—";
    await loadTransactions();
  } catch (err) {
    $("loginError").textContent = "Username or PIN is incorrect. Please try again.";
  } finally { button.disabled = false; button.textContent = "Sign in"; $("pin").value = ""; }
});

async function loadTransactions(){
  const box = $("transactions"); box.innerHTML="";
  try{
    const q = query(collection(db,"users",currentUserId,"transactions"),orderBy("createdAt","desc"));
    const snap = await getDocs(q);
    if(snap.empty){box.innerHTML='<div class="empty">No transactions yet.</div>';return;}
    snap.forEach(doc=>{
      const t=doc.data(), row=document.createElement("div"); row.className="tx";
      const left=document.createElement("div"), right=document.createElement("div");
      left.innerHTML='<div class="tx-title"></div><div class="tx-meta"></div>';
      left.querySelector(".tx-title").textContent=t.description||t.type||"Transaction";
      const date=t.createdAt?.toDate?.(); left.querySelector(".tx-meta").textContent=date?date.toLocaleString():"";
      right.className="amount"; right.textContent=(t.direction==="deposit"?"+":"−")+money(String(t.amount||"").replace(/[^\d.-]/g,""));
      row.append(left,right);box.append(row);
    });
  }catch(e){box.innerHTML='<div class="error">Could not load transaction history.</div>';}
}
document.querySelectorAll("nav button").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b===btn));
  ["overview","history","account"].forEach(id=>$(id).classList.toggle("hidden",id!==btn.dataset.tab));
}));
$("logout").addEventListener("click",()=>{currentUserId=null;$("app").classList.add("hidden");$("login").classList.remove("hidden");});
</script>
</body>
</html>
